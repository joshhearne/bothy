# Attachments and logos on the NAS.
#
#   docker compose -f docker-compose.yml -f docker-compose.nfs.yml up -d
#
# Set NFS_SERVER and NFS_UPLOADS_PATH in .env first, and export the share to
# this host. Uploaded files are write-once, read-many, which is exactly what a
# share is good at.
#
# The database is deliberately not here: Postgres is hot data and wants local
# disk. Put its backups on the NAS instead (docs/BACKUP.md).
#
# Moving an existing instance: stop the stack, copy what is already in the
# volume onto the share, then start with this file.
#
#   docker run --rm -v bothy_uploads:/from -v /mnt/nas/bothy/uploads:/to \
#     alpine sh -c 'cp -a /from/. /to/'
services:
  app:
    volumes:
      - uploads-nfs:/data/uploads

volumes:
  uploads-nfs:
    driver: local
    driver_opts:
      type: nfs
      # hard and the retry settings matter: a share that blinks should make a
      # request wait, not fail an upload halfway through writing it.
      o: "addr=${NFS_SERVER},nfsvers=4,rw,hard,timeo=600,retrans=2"
      device: ":${NFS_UPLOADS_PATH}"
