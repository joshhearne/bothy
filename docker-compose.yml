services:
  app:
    build: .
    restart: unless-stopped
    # ENV_FILE lets a second stack on this host (a test copy, a staging copy)
    # run from its own file without touching the deployment's .env.
    env_file: ${ENV_FILE:-.env}
    # Only what a second stack on this host has to override from the shell.
    # Everything else comes from the env file: compose interpolates `${X}` from
    # .env alone, never from ENV_FILE, so naming a key here at all would hand
    # the container .env's value — or an empty one — over the file's.
    environment:
      NODE_ENV: production
      # Without this a deployment's public APP_URL reaches a test stack, where
      # it turns on Secure cookies over plain http and sign-in stops working.
      APP_URL: ${APP_URL}
    # Host port only. The container always listens on 3000. Set APP_BIND to
    # 127.0.0.1 when a reverse proxy or tunnel on this host is the only thing
    # that should reach it.
    ports: ["${APP_BIND:-0.0.0.0}:${APP_PORT:-3080}:3000"]
    volumes: ["uploads:/data/uploads"]
    networks: [public, internal]
    # Uploads and HEIC conversion are the variable load here, and this box runs
    # other things. Override in .env if the instance is large.
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: ${APP_MEMORY:-1g}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Overridable for deployments with their own naming rules.
      POSTGRES_USER: ${POSTGRES_USER:-bothy}
      POSTGRES_DB: ${POSTGRES_DB:-bothy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bothy}"]
      interval: 5s
      retries: 10

  # Optional: enable with `docker compose --profile vault up -d`
  # Never add a ports: entry here. bw serve has no authentication.
  bw-serve:
    profiles: ["vault"]
    build: ./docker/bw-serve
    restart: unless-stopped
    environment:
      BW_SERVER_URL: ${BW_SERVER_URL}
      BW_CLIENTID: ${BW_CLIENTID}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET}
    secrets: [bw_master_password]
    networks: [internal]

  # Optional: enable with `docker compose --profile onepassword up -d`
  # Connect holds the credentials that reach 1Password. Like bw-serve it never
  # publishes a port: only the app, on the internal network, may talk to it.
  op-connect-api:
    profiles: ["onepassword"]
    image: 1password/connect-api:latest
    restart: unless-stopped
    volumes:
      - ./secrets/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - op-connect-data:/home/opuser/.op/data
    networks: [internal]

  op-connect-sync:
    profiles: ["onepassword"]
    image: 1password/connect-sync:latest
    restart: unless-stopped
    volumes:
      - ./secrets/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - op-connect-data:/home/opuser/.op/data
    networks: [internal]

networks:
  public:
  internal:
    internal: true

secrets:
  bw_master_password:
    file: ./secrets/bw_master_password.txt

volumes:
  pgdata:
  # Attachments and logos. Keep them on the NAS with docker-compose.nfs.yml,
  # which redefines this volume without touching the default.
  uploads:
  op-connect-data:
